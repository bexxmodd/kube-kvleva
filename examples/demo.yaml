# Sample workloads that exercise what kvleva shows: nesting, arrows, and all
# three health colors. Apply to a throwaway cluster:
#
#   kubectl --context kind-kvleva apply -f examples/demo.yaml
#
# Remove again with:
#
#   kubectl --context kind-kvleva delete namespace kvleva-demo
apiVersion: v1
kind: Namespace
metadata:
  name: kvleva-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: kvleva-demo
data:
  GREETING: hello from kvleva
---
apiVersion: v1
kind: Secret
metadata:
  name: web-credentials
  namespace: kvleva-demo
stringData:
  password: not-a-real-password
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: kvleva-demo
---
# Green: a deployment whose pods run two containers each. Arrows lead to the
# config map, the secret, the service account, and the node of each pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kvleva-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      serviceAccountName: web
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef: {name: web-config}
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef: {name: web-credentials, key: password}
        - name: sidecar
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
---
# The service is connected to the pods it selects.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kvleva-demo
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 80
---
# Red: the container exits right away, so the pod ends up in
# CrashLoopBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashing
  namespace: kvleva-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: crashing}
  template:
    metadata:
      labels: {app: crashing}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo failing on purpose; exit 1"]
---
# Red: the image does not exist, so the pod ends up in ImagePullBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-image
  namespace: kvleva-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: missing-image}
  template:
    metadata:
      labels: {app: missing-image}
    spec:
      containers:
        - name: app
          image: registry.invalid/kvleva/does-not-exist:1
---
# Yellow: no node carries this label, so the pod stays pending.
apiVersion: v1
kind: Pod
metadata:
  name: unschedulable
  namespace: kvleva-demo
spec:
  nodeSelector:
    kvleva.example/no-such-node: "true"
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
---
# Green once finished: a job that completes.
apiVersion: batch/v1
kind: Job
metadata:
  name: one-shot
  namespace: kvleva-demo
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: task
          image: busybox:1.36
          command: ["sh", "-c", "echo done"]
