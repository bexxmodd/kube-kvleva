<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kvleva</title>
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="header">
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true"
            title="Hide the filters panel"><span aria-hidden="true">☰</span> Filters</button>
    <h1 class="app-name">kvleva</h1>
    <span id="cluster-name" class="cluster-name"></span>
    <span id="cluster-version" class="cluster-version"></span>
    <span id="sync" class="sync" role="status"></span>
    <span id="stream" class="stream" role="status"></span>
    <label class="switch" title="Show what the cluster brought along: system namespaces, built-in resources, and what was installed when the cluster was created">
      <input id="system-toggle" type="checkbox" role="switch">
      <span class="switch-track" aria-hidden="true"></span>
      <span class="switch-label">System resources</span>
      <span id="system-count" class="switch-count"></span>
    </label>
    <div id="pills" class="pills" role="group" aria-label="Cluster health totals"></div>
    <input id="search" class="search" type="search" placeholder="Search by name…"
           aria-label="Search resources by name" autocomplete="off" spellcheck="false">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to the day theme"
            title="Switch to the day theme"><span id="theme-icon" aria-hidden="true">&#x2600;&#xFE0E;</span> <span id="theme-name">Day</span></button>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Filters">
      <h2 class="sidebar-title">Filters</h2>

      <fieldset id="health-filter" class="filter-group">
        <legend>Health</legend>
        <label class="check"><input type="checkbox" data-health="green" checked>
          <span class="dot health-green" aria-hidden="true">●</span> green</label>
        <label class="check"><input type="checkbox" data-health="yellow" checked>
          <span class="dot health-yellow" aria-hidden="true">▲</span> yellow</label>
        <label class="check"><input type="checkbox" data-health="red" checked>
          <span class="dot health-red" aria-hidden="true">■</span> red</label>
      </fieldset>

      <fieldset id="kinds-filter" class="filter-group">
        <legend>Resource types</legend>
        <input id="kind-search" class="kind-search" type="search" placeholder="Narrow types…"
               aria-label="Narrow the list of resource types" autocomplete="off" spellcheck="false">
        <div class="kind-buttons">
          <button id="kinds-all" type="button">All</button>
          <button id="kinds-none" type="button">None</button>
        </div>
        <ul id="kind-list" class="kind-list"></ul>
      </fieldset>
    </nav>

    <div id="sidebar-resizer" class="resizer" role="separator" aria-orientation="vertical" aria-controls="sidebar"
         aria-label="Resize the filters panel" tabindex="0" title="Drag to resize the filters panel"></div>

    <main id="canvas" class="canvas" aria-label="Cluster">
      <div id="canvas-content" class="canvas-content">
        <section id="cluster-box" class="cluster-box">
          <header class="cluster-head">
            <h2 id="cluster-title" class="cluster-title">cluster</h2>
            <button id="expand-all" type="button">Expand all</button>
            <button id="collapse-all" type="button">Collapse all</button>
          </header>
          <div id="areas" class="areas"></div>
        </section>
      </div>
    </main>

    <div id="drawer-resizer" class="resizer" role="separator" aria-orientation="vertical" aria-controls="drawer"
         aria-label="Resize the details panel" tabindex="0" title="Drag to resize the details panel" hidden></div>

    <aside id="drawer" class="drawer" aria-label="Details" hidden>
      <button id="drawer-close" class="drawer-close" type="button" aria-label="Close details">×</button>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>
  </div>

  <p id="app-error" class="app-error" role="alert" hidden></p>
</body>
</html>
